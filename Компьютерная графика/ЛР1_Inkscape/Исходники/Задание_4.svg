<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="50" font-size="30" font-family="serif" font-weight="bold">Задание 4. Работа с текстом</text>
<text x="70" y="130" font-size="36" font-family="sans-serif" fill="#159c9b">хорошая погода</text>
<rect x="60" y="175" width="300" height="130" fill="none" stroke="#aaa" stroke-dasharray="8,5"/><text x="75" y="215" font-size="28" font-family="sans-serif" fill="#8a3030"><tspan x="75" dy="0">Как правильно</tspan><tspan x="75" dy="36">подрезать</tspan><tspan x="75" dy="36">виноградную лозу</tspan></text>
<path id="curve" d="M 80 410 Q 220 280 360 410 T 650 410" fill="none" stroke="#c66" stroke-width="2"/>
<text font-size="25" font-family="serif" font-style="italic" fill="#3344aa"><textPath href="#curve">Мои дела самые важные прямо сейчас — текст размещён по контуру</textPath></text>
<polygon points="780,320 806,370 857,348 845,403 898,419 854,453 884,500 828,498 821,553 780,515 739,553 732,498 676,500 706,453 662,419 715,403 703,348 754,370" fill="none" stroke="#d44" stroke-width="3"/>
<text x="700" y="365" font-size="20" font-family="serif"><tspan x="705">Печать текста</tspan><tspan x="700" dy="28">внутри области</tspan><tspan x="690" dy="28">произвольной формы</tspan><tspan x="700" dy="28">с переносом строк</tspan><tspan x="720" dy="28">и форматированием</tspan></text>
</svg>