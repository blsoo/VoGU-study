name: Build DOCX reports
on:
  push:
    paths:
      - '.github/scripts/build_reports.py'
      - '.github/workflows/reconstruct-reports.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip python-docx pillow
      - name: Build reports
        run: python .github/scripts/build_reports.py
      - name: Commit DOCX reports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .report-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build verified DOCX lab reports 3-5'
          git push
